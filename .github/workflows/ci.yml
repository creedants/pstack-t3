name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  PSTACK_TEST_REAL_PROCESS: '1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  part_310_1:
    name: part (3.10, 1/4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - run: pip install pyyaml
      - &select_browser
        run: |
          set -e
          browser=$(python3 - <<'PY'
          import sys
          import tempfile
          from tests.test_activity_render import select_browser
          with tempfile.TemporaryDirectory(ignore_cleanup_errors=True) as directory:
              path, unavailable = select_browser(directory)
          if path is None:
              print("no working headless browser: " + "; ".join(unavailable), file=sys.stderr)
              with tempfile.TemporaryDirectory(ignore_cleanup_errors=True) as directory:
                  path, unavailable = select_browser(directory, timeout=60)
          if path is None:
              print("no working headless browser: " + "; ".join(unavailable))
              raise SystemExit(1)
          print(path)
          PY
          ) || { printf '%s\n' "$browser"; exit 1; }
          printf '%s\n' "$browser"
          "$browser" --version
      - run: python3 scripts/run_tests.py --part 1/4

  part_310_2:
    name: part (3.10, 2/4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - run: pip install pyyaml
      - *select_browser
      - run: python3 scripts/run_tests.py --part 2/4

  part_310_3:
    name: part (3.10, 3/4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - run: pip install pyyaml
      - *select_browser
      - run: python3 scripts/run_tests.py --part 3/4

  part_310_4:
    name: part (3.10, 4/4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - run: pip install pyyaml
      - *select_browser
      - run: python3 scripts/run_tests.py --part 4/4

  part_312_1:
    name: part (3.12, 1/4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - *select_browser
      - run: python3 scripts/run_tests.py --part 1/4

  part_312_2:
    name: part (3.12, 2/4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - *select_browser
      - run: python3 scripts/run_tests.py --part 2/4

  part_312_3:
    name: part (3.12, 3/4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - *select_browser
      - run: python3 scripts/run_tests.py --part 3/4

  part_312_4:
    name: part (3.12, 4/4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - *select_browser
      - run: python3 scripts/run_tests.py --part 4/4

  test_310:
    name: test (3.10)
    runs-on: ubuntu-latest
    needs: [part_310_1, part_310_2, part_310_3, part_310_4]
    if: always()
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - run: pip install pyyaml
      - run: |
          test "${{ needs.part_310_1.result }}" = success
          test "${{ needs.part_310_2.result }}" = success
          test "${{ needs.part_310_3.result }}" = success
          test "${{ needs.part_310_4.result }}" = success
      - name: Generated skills match the sources
        run: |
          python3 scripts/build.py
          git diff --exit-code -- skills docs/skills.md docs/cli
          test -z "$(git status --porcelain -- skills docs/skills.md docs/cli)"

  test_312:
    name: test (3.12)
    runs-on: ubuntu-latest
    needs: [part_312_1, part_312_2, part_312_3, part_312_4, macos_312_1, macos_312_2, macos_312_3, macos_312_4]
    if: always()
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: |
          test "${{ needs.part_312_1.result }}" = success
          test "${{ needs.part_312_2.result }}" = success
          test "${{ needs.part_312_3.result }}" = success
          test "${{ needs.part_312_4.result }}" = success
          case "$GITHUB_EVENT_NAME" in
            push) expected=success ;;
            pull_request) expected=skipped ;;
            *) exit 1 ;;
          esac
          test "${{ needs.macos_312_1.result }}" = "$expected"
          test "${{ needs.macos_312_2.result }}" = "$expected"
          test "${{ needs.macos_312_3.result }}" = "$expected"
          test "${{ needs.macos_312_4.result }}" = "$expected"
      - name: Generated skills match the sources
        run: |
          python3 scripts/build.py
          git diff --exit-code -- skills docs/skills.md docs/cli
          test -z "$(git status --porcelain -- skills docs/skills.md docs/cli)"

  # Part 1 of 4. Runs on a push only. A step failure fails this job. test (3.12) lists macos_312_1 in needs and requires success on push and skipped on pull_request.
  macos_312_1:
    name: macOS (3.12, 1/4)
    runs-on: macos-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - *select_browser
      - name: Test part 1/4
        run: |
          log="$RUNNER_TEMP/macos-312.txt"
          : > "$log"
          status=0
          python3 scripts/run_tests.py --part 1/4 >> "$log" 2>&1 || status=1
          cat "$log" || true
          {
            grep -E '^Ran [0-9]+ tests? in ' "$log" || true
            grep -E '^(OK|FAILED)' "$log" || true
            grep -E '^(FAIL|ERROR): ' "$log" || true
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Generated skills match the sources
        run: |
          python3 scripts/build.py
          git diff --exit-code -- skills docs/skills.md docs/cli
          test -z "$(git status --porcelain -- skills docs/skills.md docs/cli)"

  # Part 2 of 4. Runs on a push only. A step failure fails this job. test (3.12) lists macos_312_2 in needs and requires success on push and skipped on pull_request.
  macos_312_2:
    name: macOS (3.12, 2/4)
    runs-on: macos-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - *select_browser
      - name: Test part 2/4
        run: |
          log="$RUNNER_TEMP/macos-312.txt"
          : > "$log"
          status=0
          python3 scripts/run_tests.py --part 2/4 >> "$log" 2>&1 || status=1
          cat "$log" || true
          {
            grep -E '^Ran [0-9]+ tests? in ' "$log" || true
            grep -E '^(OK|FAILED)' "$log" || true
            grep -E '^(FAIL|ERROR): ' "$log" || true
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  # Part 3 of 4. Runs on a push only. A step failure fails this job. test (3.12) lists macos_312_3 in needs and requires success on push and skipped on pull_request.
  macos_312_3:
    name: macOS (3.12, 3/4)
    runs-on: macos-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - *select_browser
      - name: Test part 3/4
        run: |
          log="$RUNNER_TEMP/macos-312.txt"
          : > "$log"
          status=0
          python3 scripts/run_tests.py --part 3/4 >> "$log" 2>&1 || status=1
          cat "$log" || true
          {
            grep -E '^Ran [0-9]+ tests? in ' "$log" || true
            grep -E '^(OK|FAILED)' "$log" || true
            grep -E '^(FAIL|ERROR): ' "$log" || true
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  # Part 4 of 4. Runs on a push only. A step failure fails this job. test (3.12) lists macos_312_4 in needs and requires success on push and skipped on pull_request.
  macos_312_4:
    name: macOS (3.12, 4/4)
    runs-on: macos-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - *select_browser
      - name: Test part 4/4
        run: |
          log="$RUNNER_TEMP/macos-312.txt"
          : > "$log"
          status=0
          python3 scripts/run_tests.py --part 4/4 >> "$log" 2>&1 || status=1
          cat "$log" || true
          {
            grep -E '^Ran [0-9]+ tests? in ' "$log" || true
            grep -E '^(OK|FAILED)' "$log" || true
            grep -E '^(FAIL|ERROR): ' "$log" || true
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
