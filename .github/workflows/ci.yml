name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  PSTACK_TEST_REAL_PROCESS: '1'
  # Chromium puts its SingletonSocket under TMPDIR and the probe models a 107-character limit. The macOS
  # runner's default TMPDIR is a long /var/folders path, and the isolated test run root sits under it.
  TMPDIR: /tmp

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Parts 1 to 8 of 8. Run on a pull request only. A step failure fails this job. test (3.10) lists part_310_1 through part_310_8 in needs and requires success on pull_request and skipped on push.
  part_310_1:
    name: part (3.10, 1/8)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - run: pip install pyyaml
      - run: python3 scripts/run_tests.py --part 1/8

  part_310_2:
    name: part (3.10, 2/8)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - run: pip install pyyaml
      - run: python3 scripts/run_tests.py --part 2/8

  part_310_3:
    name: part (3.10, 3/8)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - run: pip install pyyaml
      - run: python3 scripts/run_tests.py --part 3/8

  part_310_4:
    name: part (3.10, 4/8)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - run: pip install pyyaml
      - run: python3 scripts/run_tests.py --part 4/8

  part_310_5:
    name: part (3.10, 5/8)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - run: pip install pyyaml
      - run: python3 scripts/run_tests.py --part 5/8

  part_310_6:
    name: part (3.10, 6/8)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - run: pip install pyyaml
      - run: python3 scripts/run_tests.py --part 6/8

  part_310_7:
    name: part (3.10, 7/8)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - run: pip install pyyaml
      - run: python3 scripts/run_tests.py --part 7/8

  part_310_8:
    name: part (3.10, 8/8)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - run: pip install pyyaml
      - run: python3 scripts/run_tests.py --part 8/8

  # Parts 1 to 8 of 8. Run on a pull request only. A step failure fails this job. test (3.12) lists part_312_1 through part_312_8 in needs and requires success on pull_request and skipped on push.
  part_312_1:
    name: part (3.12, 1/8)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python3 scripts/run_tests.py --part 1/8

  part_312_2:
    name: part (3.12, 2/8)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python3 scripts/run_tests.py --part 2/8

  part_312_3:
    name: part (3.12, 3/8)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python3 scripts/run_tests.py --part 3/8

  part_312_4:
    name: part (3.12, 4/8)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python3 scripts/run_tests.py --part 4/8

  part_312_5:
    name: part (3.12, 5/8)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python3 scripts/run_tests.py --part 5/8

  part_312_6:
    name: part (3.12, 6/8)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python3 scripts/run_tests.py --part 6/8

  part_312_7:
    name: part (3.12, 7/8)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python3 scripts/run_tests.py --part 7/8

  part_312_8:
    name: part (3.12, 8/8)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python3 scripts/run_tests.py --part 8/8

  test_310:
    name: test (3.10)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [part_310_1, part_310_2, part_310_3, part_310_4, part_310_5, part_310_6, part_310_7, part_310_8, browser_linux, generated]
    if: always()
    steps:
      - run: |
          case "$GITHUB_EVENT_NAME" in
            push) linux=skipped ;;
            pull_request) linux=success ;;
            *) exit 1 ;;
          esac
          test "${{ needs.part_310_1.result }}" = "$linux"
          test "${{ needs.part_310_2.result }}" = "$linux"
          test "${{ needs.part_310_3.result }}" = "$linux"
          test "${{ needs.part_310_4.result }}" = "$linux"
          test "${{ needs.part_310_5.result }}" = "$linux"
          test "${{ needs.part_310_6.result }}" = "$linux"
          test "${{ needs.part_310_7.result }}" = "$linux"
          test "${{ needs.part_310_8.result }}" = "$linux"
          test "${{ needs.browser_linux.result }}" = "$linux"
          test "${{ needs.generated.result }}" = success

  test_312:
    name: test (3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [part_312_1, part_312_2, part_312_3, part_312_4, part_312_5, part_312_6, part_312_7, part_312_8, browser_linux, generated, browser_macos, macos_312_1, macos_312_2, macos_312_3, macos_312_4]
    if: always()
    steps:
      - run: |
          case "$GITHUB_EVENT_NAME" in
            push) linux=skipped; macos=success ;;
            pull_request) linux=success; macos=skipped ;;
            *) exit 1 ;;
          esac
          test "${{ needs.part_312_1.result }}" = "$linux"
          test "${{ needs.part_312_2.result }}" = "$linux"
          test "${{ needs.part_312_3.result }}" = "$linux"
          test "${{ needs.part_312_4.result }}" = "$linux"
          test "${{ needs.part_312_5.result }}" = "$linux"
          test "${{ needs.part_312_6.result }}" = "$linux"
          test "${{ needs.part_312_7.result }}" = "$linux"
          test "${{ needs.part_312_8.result }}" = "$linux"
          test "${{ needs.browser_linux.result }}" = "$linux"
          test "${{ needs.macos_312_1.result }}" = "$macos"
          test "${{ needs.macos_312_2.result }}" = "$macos"
          test "${{ needs.macos_312_3.result }}" = "$macos"
          test "${{ needs.macos_312_4.result }}" = "$macos"
          test "${{ needs.browser_macos.result }}" = "$macos"
          test "${{ needs.generated.result }}" = success

  generated:
    name: generated files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Generated skills match the sources
        run: |
          python3 scripts/build.py
          git diff --exit-code -- skills docs/skills.md docs/cli
          test -z "$(git status --porcelain -- skills docs/skills.md docs/cli)"

  # Browser probe for Linux. Runs on a pull request only. The Linux part jobs skip the probe. test (3.10) and test (3.12) list browser_linux in needs and require success on pull_request and skipped on push.
  browser_linux:
    name: browser (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - &select_browser
        run: |
          set -e
          browser=$(python3 - <<'PY'
          import sys
          import tempfile
          from tests.test_activity_render import select_browser
          with tempfile.TemporaryDirectory(ignore_cleanup_errors=True) as directory:
              path, unavailable = select_browser(directory)
          if path is None:
              print("no working headless browser: " + "; ".join(unavailable), file=sys.stderr)
              with tempfile.TemporaryDirectory(ignore_cleanup_errors=True) as directory:
                  path, unavailable = select_browser(directory, timeout=60)
          if path is None:
              print("no working headless browser: " + "; ".join(unavailable))
              raise SystemExit(1)
          print(path)
          PY
          ) || { printf '%s\n' "$browser"; exit 1; }
          printf '%s\n' "$browser"
          "$browser" --version

  # Browser probe for macOS. Runs on a push only. The macOS part jobs skip the probe. test (3.12) lists browser_macos in needs and requires success on push and skipped on pull_request.
  browser_macos:
    name: browser (macOS)
    runs-on: macos-latest
    timeout-minutes: 10
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - *select_browser

  # Part 1 of 4. Runs on a push only. A step failure fails this job. test (3.12) lists macos_312_1 in needs and requires success on push and skipped on pull_request.
  macos_312_1:
    name: macOS (3.12, 1/4)
    runs-on: macos-latest
    timeout-minutes: 30
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Test part 1/4
        run: |
          log="$RUNNER_TEMP/macos-312.txt"
          : > "$log"
          status=0
          python3 scripts/run_tests.py --part 1/4 >> "$log" 2>&1 || status=1
          cat "$log" || true
          {
            grep -E '^Ran [0-9]+ tests? in ' "$log" || true
            grep -E '^(OK|FAILED)' "$log" || true
            grep -E '^(FAIL|ERROR): ' "$log" || true
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  # Part 2 of 4. Runs on a push only. A step failure fails this job. test (3.12) lists macos_312_2 in needs and requires success on push and skipped on pull_request.
  macos_312_2:
    name: macOS (3.12, 2/4)
    runs-on: macos-latest
    timeout-minutes: 30
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Test part 2/4
        run: |
          log="$RUNNER_TEMP/macos-312.txt"
          : > "$log"
          status=0
          python3 scripts/run_tests.py --part 2/4 >> "$log" 2>&1 || status=1
          cat "$log" || true
          {
            grep -E '^Ran [0-9]+ tests? in ' "$log" || true
            grep -E '^(OK|FAILED)' "$log" || true
            grep -E '^(FAIL|ERROR): ' "$log" || true
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  # Part 3 of 4. Runs on a push only. A step failure fails this job. test (3.12) lists macos_312_3 in needs and requires success on push and skipped on pull_request.
  macos_312_3:
    name: macOS (3.12, 3/4)
    runs-on: macos-latest
    timeout-minutes: 30
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Test part 3/4
        run: |
          log="$RUNNER_TEMP/macos-312.txt"
          : > "$log"
          status=0
          python3 scripts/run_tests.py --part 3/4 >> "$log" 2>&1 || status=1
          cat "$log" || true
          {
            grep -E '^Ran [0-9]+ tests? in ' "$log" || true
            grep -E '^(OK|FAILED)' "$log" || true
            grep -E '^(FAIL|ERROR): ' "$log" || true
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  # Part 4 of 4. Runs on a push only. A step failure fails this job. test (3.12) lists macos_312_4 in needs and requires success on push and skipped on pull_request.
  macos_312_4:
    name: macOS (3.12, 4/4)
    runs-on: macos-latest
    timeout-minutes: 30
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Test part 4/4
        run: |
          log="$RUNNER_TEMP/macos-312.txt"
          : > "$log"
          status=0
          python3 scripts/run_tests.py --part 4/4 >> "$log" 2>&1 || status=1
          cat "$log" || true
          {
            grep -E '^Ran [0-9]+ tests? in ' "$log" || true
            grep -E '^(OK|FAILED)' "$log" || true
            grep -E '^(FAIL|ERROR): ' "$log" || true
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
