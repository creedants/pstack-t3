\* The queue in merge mode. A pull request carries the checked candidate and the
\* forge merges it.
CONSTANTS
  Holders = {"docs/A", "engine/B"}
  Paths = {"a", "b"}
  Leases = {1, 2}
  Entries = {"E1", "E2"}
  Commits = {"c0", "c1", "c2", "c4", "c5", "c6", "s1", "s2"}
  Generations = {1}
  Ttls = {1}
  MaxClock = 1
  Mode = "merge"
  Scope = "queue"
  Break = "none"

  Depth = 18

INIT Init
NEXT BoundNext
VIEW View
INVARIANTS
  NoOverlappingLeases
  NoStaleWrite
  OneIntegration
  LandedIsOnTrunk
  TrunkNeverRewinds
  CheckedHeadOnly
  NoStalledEntry
  EntryKeepsItsLease
  NoDoubleLanding
