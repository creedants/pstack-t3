\* The queue half in merge mode: a pull request at the checked candidate and a
\* forge that merges it only while the head matches and the required checks pass.
CONSTANTS
  Holders = {"docs/A", "engine/B"}
  Paths = {"a", "b"}
  Leases = {"L1", "L2"}
  Entries = {"E1", "E2"}
  Commits = {"c0", "c1", "c2"}
  Mode = "merge"
  Scope = "queue"
  Break = "none"

  Depth = 13

INIT Init
NEXT BoundNext
CONSTRAINT Bound
INVARIANTS
  NoOverlappingLeases
  NoStaleWrite
  OneIntegration
  LandedIsOnTrunk
  CheckedHeadOnly
  NoStalledEntry
  EntryKeepsItsLease
  NoDoubleLanding
