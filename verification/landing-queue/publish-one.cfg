\* One entry in publish mode with every lease write and two generations. TLC runs
\* out of new states before Depth, so this search is exhaustive for these constants.
CONSTANTS
  Holders = {"docs/A", "engine/B"}
  Paths = {"a", "b"}
  Leases = {1, 2}
  Entries = {"E1"}
  Commits = {"c0", "c1", "c2", "c4", "c5"}
  Generations = {1, 2}
  Ttls = {1}
  MaxClock = 1
  Mode = "publish"
  Scope = "all"
  Break = "none"

  Depth = 30

INIT Init
NEXT BoundNext
VIEW View
INVARIANTS
  NoOverlappingLeases
  NoStaleWrite
  OneIntegration
  LandedIsOnTrunk
  TrunkNeverRewinds
  CheckedHeadOnly
  NoStalledEntry
  EntryKeepsItsLease
  NoDoubleLanding
  WidenKeepsCoverage
