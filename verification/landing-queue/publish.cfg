\* The queue half in publish mode: the integration worktree, one lease-guarded
\* push, and recovery after a crash.
CONSTANTS
  Holders = {"docs/A", "engine/B"}
  Paths = {"a", "b"}
  Leases = {"L1", "L2"}
  Entries = {"E1", "E2"}
  Commits = {"c0", "c1", "c2"}
  Mode = "publish"
  Scope = "queue"
  Break = "none"

  Depth = 13

INIT Init
NEXT BoundNext
CONSTRAINT Bound
INVARIANTS
  NoOverlappingLeases
  NoStaleWrite
  OneIntegration
  LandedIsOnTrunk
  CheckedHeadOnly
  NoStalledEntry
  EntryKeepsItsLease
  NoDoubleLanding
