\* The queue in publish mode. The integration worktree, one lease-guarded push,
\* and recovery after a crash.
CONSTANTS
  Holders = {"docs/A", "engine/B"}
  Paths = {"a", "b"}
  Leases = {1, 2}
  Entries = {"E1", "E2"}
  Commits = {"c0", "c1", "c2", "c4", "c5"}
  Generations = {1}
  Ttls = {1}
  MaxClock = 1
  Mode = "publish"
  Scope = "queue"
  Break = "none"

  Depth = 24

INIT Init
NEXT BoundNext
VIEW View
INVARIANTS
  NoOverlappingLeases
  NoStaleWrite
  OneIntegration
  LandedIsOnTrunk
  TrunkNeverRewinds
  CheckedHeadOnly
  NoStalledEntry
  EntryKeepsItsLease
  NoDoubleLanding
