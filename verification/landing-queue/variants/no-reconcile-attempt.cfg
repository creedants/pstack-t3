\* EXPECT: NoStalledEntry
\* `reconcile` stops reading the attempt table, so an interrupted run's publishing row stays publishing.
CONSTANTS
  Holders = {"docs/A", "engine/B"}
  Paths = {"a", "b"}
  Leases = {1}
  Entries = {"E1"}
  Commits = {"c0", "c1", "c2"}
  Generations = {1}
  Ttls = {1}
  MaxClock = 1
  Mode = "publish"
  Scope = "queue"
  Break = "no-reconcile-attempt"

  Depth = 16

INIT Init
NEXT BoundNext
VIEW View
INVARIANTS
  NoStalledEntry
