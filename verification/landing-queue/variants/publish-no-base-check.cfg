\* EXPECT: TrunkNeverRewinds
\* `publish` uses a bare --force in place of --force-with-lease=refs/heads/<trunk>:<base>. A plain push would still refuse a non-fast-forward update. The lease also refuses when the remote moved, where a bare force overwrites it.
CONSTANTS
  Holders = {"docs/A", "engine/B"}
  Paths = {"a", "b"}
  Leases = {1}
  Entries = {"E1"}
  Commits = {"c0", "c1", "c2"}
  Generations = {1}
  Ttls = {1}
  MaxClock = 1
  Mode = "publish"
  Scope = "queue"
  Break = "publish-no-base-check"

  Depth = 16

INIT Init
NEXT BoundNext
VIEW View
INVARIANTS
  TrunkNeverRewinds
