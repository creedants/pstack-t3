\* EXPECT: LandedIsOnTrunk
\* `attempt` settles the entry landed before the push that puts it on trunk.
CONSTANTS
  Holders = {"docs/A", "engine/B"}
  Paths = {"a", "b"}
  Leases = {1}
  Entries = {"E1"}
  Commits = {"c0", "c1", "c2"}
  Generations = {1}
  Ttls = {1}
  MaxClock = 1
  Mode = "publish"
  Scope = "queue"
  Break = "settle-before-publish"

  Depth = 16

INIT Init
NEXT BoundNext
VIEW View
INVARIANTS
  LandedIsOnTrunk
